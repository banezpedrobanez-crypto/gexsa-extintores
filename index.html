<style>
  :root{
    --azul:#12386e;
    --azul-claro:#e8f1fb;
    --azul-pill:#dceafc;
    --rojo:#e4262c;
    --rojo-osc:#c81e24;
    --gris:#6b7c93;
    --linea:#cfe0f2;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
    background:#fff;color:var(--azul);
    padding:28px 18px 48px;
    max-width:560px;margin:0 auto;
  }

  /* ---------- Encabezado ---------- */
  .logo{text-align:center;margin-bottom:18px}
  .logo img{
    width:clamp(150px,42vw,210px);height:auto;display:inline-block;
  }
  .pill{
    display:block;width:fit-content;margin:0 auto 18px;
    background:var(--azul-pill);color:var(--azul);
    font-size:13px;font-weight:700;letter-spacing:.5px;
    padding:9px 22px;border-radius:999px;text-align:center;
  }
  h1{
    text-align:center;font-size:clamp(26px,7vw,36px);
    font-weight:800;margin-bottom:22px;
  }

  /* ---------- Tarjeta de datos ---------- */
  .datos{background:var(--azul-claro);border-radius:16px;padding:6px 20px;margin-bottom:22px}
  .campo{padding:16px 0;border-bottom:1px solid var(--linea)}
  .campo:last-child{border-bottom:none}
  .campo .et{
    font-size:11.5px;font-weight:600;letter-spacing:.9px;
    color:var(--gris);text-transform:uppercase;margin-bottom:5px;
  }
  .campo .va{font-size:19px;font-weight:800;line-height:1.28;word-break:break-word}

  /* ---------- Botones ---------- */
  .btn{
    display:flex;align-items:center;gap:14px;width:100%;
    background:var(--rojo);color:#fff;border:none;border-radius:12px;
    padding:18px 18px;margin-bottom:13px;cursor:pointer;
    font-family:inherit;font-size:15.5px;font-weight:800;letter-spacing:.3px;
    text-align:left;text-decoration:none;
    transition:background .15s,transform .08s;
  }
  .btn:active{transform:scale(.985)}
  .btn:hover{background:var(--rojo-osc)}
  .btn .ico{flex:0 0 26px;height:26px}
  .btn .tx{flex:1}
  .btn .ch{flex:0 0 auto;opacity:.9;font-size:19px;line-height:1}
  .btn.off{background:#b9c4d1;cursor:not-allowed}
  .btn.off:hover{background:#b9c4d1}

  .nota{
    font-size:12.5px;color:var(--gris);text-align:center;
    margin:-6px 0 15px;line-height:1.45;
  }

  /* ---------- Estados ---------- */
  .estado{text-align:center;padding:48px 16px;color:var(--gris);font-size:15px}
  .spin{
    width:34px;height:34px;margin:0 auto 16px;border-radius:50%;
    border:3px solid var(--linea);border-top-color:var(--azul);
    animation:g .8s linear infinite;
  }
  @keyframes g{to{transform:rotate(360deg)}}
  .err{
    background:#fdeced;border:1px solid #f5c2c5;color:#a8181e;
    border-radius:12px;padding:20px;text-align:center;font-size:14.5px;line-height:1.5;
  }
  .pie{text-align:center;font-size:11.5px;color:#9aa9bb;margin-top:26px}
</style>

    window[cb] = d => { limpiar(); ok(d); };
    const s = document.createElement('script');
    s.src = API_URL + '?serie=' + encodeURIComponent(serie) + '&callback=' + cb;
    s.onerror = () => { limpiar(); fail(new Error('red')); };
    document.body.appendChild(s);
  });
}

/* ------------------------------------------------------------------
   Pintar la ficha
------------------------------------------------------------------ */
const esc = v => String(v==null?'':v)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function campo(et, va){
  return '<div class="campo"><div class="et">'+et+'</div><div class="va">'+esc(va||'—')+'</div></div>';
}

function boton(ico, texto, url, motivo){
  if (url) {
    return '<a class="btn" href="'+esc(url)+'" target="_blank" rel="noopener">'
         + ICO[ico] + '<span class="tx">'+texto+'</span><span class="ch">&#8250;</span></a>';
  }
  return '<button class="btn off" type="button" disabled>'
       + ICO[ico] + '<span class="tx">'+texto+'</span><span class="ch">&#8250;</span></button>'
       + (motivo ? '<div class="nota">'+esc(motivo)+'</div>' : '');
}

/* El boton de la tarjeta no salta directo: primero le pide al sistema
   que deje la serie puesta en la hoja, y recien despues la abre. */
function botonTarjeta(d){
  return '<button class="btn" type="button" id="btnTarjeta">'
       + ICO['card'] + '<span class="tx">TARJETA DE INSPECCIÓN</span>'
       + '<span class="ch">&#8250;</span></button>'
       + '<div class="nota" id="notaTarjeta"></div>';
}

function prepararTarjeta(d){
  const b = document.getElementById('btnTarjeta');
  const n = document.getElementById('notaTarjeta');
  if (!b) return;

  b.addEventListener('click', function(){

    b.disabled = true;
    b.classList.add('off');
    b.querySelector('.tx').textContent = 'PREPARANDO LA TARJETA...';
    n.textContent = 'Un momento, se está cargando el extintor en la tarjeta.';

    const cb = 'gexsaT_' + Date.now();
    const s  = document.createElement('script');

    const listo = function(res){
      delete window[cb];
      if (s.parentNode) s.remove();

      if (res && res.ok && res.urlHoja){
        window.location.href = res.urlHoja;
        return;
      }

      b.disabled = false;
      b.classList.remove('off');
      b.querySelector('.tx').textContent = 'TARJETA DE INSPECCIÓN';
      n.textContent = 'No se pudo preparar la tarjeta. Vuelve a intentarlo.';
    };

    window[cb] = listo;
    setTimeout(function(){ if (window[cb]) listo(null); }, 45000);

    s.src = API_URL + '?accion=tarjeta&serie=' + encodeURIComponent(d.serie)
          + '&callback=' + cb;
    s.onerror = function(){ listo(null); };
    document.body.appendChild(s);
  });
}

function pintar(d){
  const titulo = d.numeroExtintor ? 'Extintor N.º ' + esc(d.numeroExtintor) : 'Extintor';

  document.getElementById('app').innerHTML =
    '<h1>'+titulo+'</h1>'
  + '<div class="datos">'
  +   campo('N.º de serie',  d.serie)
  +   campo('Cliente',       d.cliente)
  +   campo('Capacidad',     d.capacidad)
  +   campo('Agente / Clase',d.agenteClase)
  +   campo('Ubicación',     d.ubicacion)
  + '</div>'
  + boton('cert','CERTIFICADO DE OPERATIVIDAD',        d.pdfOperatividad,
          'El certificado de operatividad de este extintor todavía no está disponible.')
  + boton('pdf','CERTIFICADO DE PRUEBA HIDROSTÁTICA',  d.pdfHidrostatica,
          'Este extintor todavía no cuenta con Certificado de Prueba Hidrostática.')
  + botonTarjeta(d);

  prepararTarjeta(d);

  document.title = titulo + ' — GEXSA SOLUTIONS';
}

function error(msg){
  document.getElementById('app').innerHTML = '<div class="err">'+esc(msg)+'</div>';
}

/* ------------------------------------------------------------------
   Arranque
------------------------------------------------------------------ */
(async function(){
  const serie = serieDelQR();

  if (!serie){
    error('Esta ficha se abre escaneando el código QR del extintor.');
    return;
  }
  if (API_URL.indexOf('PEGAR_AQUI') === 0){
    error('Falta configurar la dirección del sistema (API_URL) en el archivo index.html.');
    return;
  }

  try{
    const d = await consultar(serie);
    if (d && d.ok) pintar(d);
    else error(d && d.error ? d.error : 'No se encontró información para la serie ' + serie + '.');
  }catch(e){
    error('No se pudo conectar con el sistema. Espera unos segundos y vuelve a cargar la página.');
  }
})();
</script>
</body>
</html>
