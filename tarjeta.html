<style>
  :root{
    --azul:#12386e; --azul-claro:#e8f1fb; --azul-pill:#dceafc;
    --rojo:#e4262c; --verde:#1c7c4a; --gris:#6b7c93; --linea:#cfe0f2;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
       background:#fff;color:var(--azul);padding:22px 14px 60px;
       max-width:640px;margin:0 auto;font-size:15px}

  .logo{text-align:center;margin-bottom:14px}
  .logo img{width:clamp(130px,36vw,175px);height:auto}

  .banda{background:var(--azul);color:#fff;text-align:center;padding:10px 12px;
    font-size:12.5px;font-weight:700;letter-spacing:.5px;line-height:1.5;
    margin-bottom:14px}
  .banda small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.4px}

  /* ----- Tarjeta igual a la de siempre: cuadros y tabla ----- */
  .serieGrande{font-size:26px;font-weight:800;letter-spacing:2px;text-align:center;
    margin:2px 0 16px;color:var(--azul)}

  .scroll{margin-bottom:12px}
  table{border-collapse:collapse;width:100%;table-layout:fixed;
        border:1.5px solid var(--azul);font-size:11px}
  td{border:1px solid var(--azul);padding:5px 6px;vertical-align:middle;
     line-height:1.3;word-break:break-word}
  td.et{background:var(--azul-pill);font-weight:700;letter-spacing:.2px;
        text-transform:uppercase}
  td.va{font-weight:700;background:#fff}
  td.cab{background:var(--azul);color:#fff;font-weight:700;text-align:center;
         letter-spacing:.5px;text-transform:uppercase}
  td.pie2{background:var(--azul);color:#fff;font-weight:700;text-align:center;
          letter-spacing:.5px;text-transform:uppercase;padding:9px}
  td.obs{background:#fff;font-weight:600;font-size:10px;width:50%;line-height:1.35}
  .distrib{text-align:center;font-size:9.5px;color:var(--azul);line-height:1.6;
    font-weight:700;letter-spacing:.2px;margin:10px 0 4px}
  td.fec{text-align:center;font-weight:600;width:74px}
  td.insp2{width:30%}

  input,select{width:100%;font-family:inherit;font-size:11px;color:var(--azul);
    border:none;border-radius:0;padding:2px 0;background:transparent;
    -webkit-appearance:none;appearance:none;font-weight:700}
  input:focus,select:focus{outline:none;background:#fffbe6}
  select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%2312386e' stroke-width='2' fill='none' stroke-linecap='round'/></svg>");
    background-repeat:no-repeat;background-position:right 2px center;padding-right:18px}

  .estado{font-size:10px;font-weight:600;min-height:12px;margin-top:2px;text-align:center}
  .ok{color:var(--verde)} .err{color:var(--rojo)} .esp{color:var(--gris)}

  .pie{text-align:center;font-size:11px;color:#9aa9bb;margin-top:28px;line-height:1.6}

  .cargando{text-align:center;padding:50px 16px;color:var(--gris)}
  .spin{width:32px;height:32px;margin:0 auto 14px;border-radius:50%;
    border:3px solid var(--linea);border-top-color:var(--azul);animation:g .8s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}
  .fallo{background:#fdeced;border:1px solid #f5c2c5;color:#a8181e;border-radius:12px;
    padding:18px;text-align:center;font-size:14px;line-height:1.5}
</style>

<script>
const esc = v => String(v==null?'':v)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function serieDelQR(){
  const p = new URLSearchParams(location.search);
  return (p.get('serie') || p.get('SERIE') || '').trim();
}

/* Llamada al sistema. Se usa <script> para evitar bloqueos entre dominios. */
let contador = 0;
function pedir(params){
  return new Promise((ok, fail) => {
    const cb = 'gx_' + (++contador) + '_' + Date.now();
    const s  = document.createElement('script');
    const t  = setTimeout(() => { fin(); fail(new Error('timeout')); }, 45000);
    function fin(){ clearTimeout(t); delete window[cb]; if(s.parentNode) s.remove(); }
    window[cb] = d => { fin(); ok(d); };
    let q = '';
    for (const k in params) q += '&' + k + '=' + encodeURIComponent(params[k]);
    s.src = API_URL + '?callback=' + cb + q;
    s.onerror = () => { fin(); fail(new Error('red')); };
    document.body.appendChild(s);
  });
}

/* Una linea de dos columnas: etiqueta | valor */
function fila2(et, va){
  return '<tr><td class="et" style="width:38%">'+et+'</td>'
       + '<td class="va" colspan="3">'+esc(va||'')+'</td></tr>';
}

/* Una linea de cuatro columnas: etiqueta | valor | etiqueta | valor */
function fila4(e1, v1, e2, v2){
  return '<tr><td class="et" style="width:38%">'+e1+'</td>'
       + '<td class="va" style="width:14%">'+esc(v1||'')+'</td>'
       + '<td class="et" style="width:20%">'+e2+'</td>'
       + '<td class="va">'+esc(v2||'')+'</td></tr>';
}

/* Una linea de la tabla de inspecciones */
function filaInspeccion(f, catalogo){
  let ops = '<option value=""></option>';
  catalogo.forEach(o => {
    ops += '<option value="'+esc(o)+'"'
        + (o === f.observacion ? ' selected' : '') + '>'+esc(o)+'</option>';
  });

  return '<tr class="insp" data-fila="'+f.fila+'">'
    + '<td class="fec"><span data-fecha>'+esc(f.fecha)+'</span>'
    +   '<div class="estado esp" data-estado></div></td>'
    + '<td class="insp2"><input type="text" data-inspector value="'+esc(f.inspector)+'" '
    +   'autocomplete="off"></td>'
    + '<td><select data-observacion>'+ops+'</select></td>'
    + '</tr>';
}

/* Cuadro final: la lista de observaciones, en dos columnas */
function descripcionObservaciones(catalogo){

  const lista = catalogo.filter(o => /^\s*\d/.test(o));
  if (!lista.length) return '';

  let html = '<div class="scroll"><table>'
           + '<tr><td class="pie2" colspan="2">Descripción de observaciones</td></tr>';

  for (let i = 0; i < lista.length; i += 2){
    html += '<tr><td class="obs">' + esc(lista[i])   + '</td>'
          +     '<td class="obs">' + esc(lista[i+1] || '') + '</td></tr>';
  }

  return html + '</table></div>';
}

function pintar(d, serie){
  const e = d.extintor;

  /* N.o de tarjeta, tal como figura en la tarjeta impresa */
  const nroTarjeta = e.patrimonial
        ? ('TI-' + e.patrimonial + ' - ' + e.serie)
        : e.serie;

  let html =
      '<div class="serieGrande">' + esc(e.serie) + '</div>'

    + '<div class="scroll"><table>'
    +   fila2('Tarjeta de inspección N°', nroTarjeta)
    +   fila2('Cliente',   e.cliente)
    +   fila2('Dirección', e.direccion)
    +   fila4('Extintor N°',        e.patrimonial || e.numeroExtintor,
              'N° de serie',        e.serie)
    +   fila4('Capacidad de carga', e.capacidad,
              'Tipo',               e.tipo)
    + '</table></div>'

    + '<div class="scroll"><table>'
    +   '<tr><td class="cab">Fecha</td><td class="cab">Inspector</td>'
    +   '<td class="cab">Observaciones</td></tr>';

  d.inspecciones.forEach(f => { html += filaInspeccion(f, d.catalogo || []); });

  html += '</table></div>'

    + '<div class="scroll"><table>'
    +   '<tr><td class="et" style="width:62%">Fecha de vencimiento de recarga / próximo mantenimiento</td>'
    +   '<td class="va">' + esc(e.vencimiento || '') + '</td></tr>'
    +   '<tr><td class="et" style="width:62%">Fecha de próxima prueba hidrostática</td>'
    +   '<td class="va">' + esc(e.ph || '') + '</td></tr>'
    + '</table></div>'

    + '<div class="scroll"><table>'
    +   '<tr><td class="pie2">Garantía de funcionamiento 12 meses</td></tr>'
    + '</table></div>'

    + '<div class="distrib">DISTRIBUIDO POR GEXSA SOLUTIONS&nbsp; |&nbsp; '
    + 'VENTA, MANTENIMIENTO Y RECARGA DE EXTINTORES<br>'
    + 'AV. TÚPAC AMARU N° 7459 – AÑO NUEVO – COMAS – LIMA&nbsp; |&nbsp; (01) 397-9709</div>'

    + descripcionObservaciones(d.catalogo || []);

  document.getElementById('app').innerHTML = html;

  document.title = 'Tarjeta ' + e.serie + ' — GEXSA';

  document.querySelectorAll('.insp').forEach(caja => conectar(caja, serie));
}

/* Reparte las fechas del calendario en cada fila de la tabla. */
function pintarFechas(cal){
  document.querySelectorAll('.insp').forEach(caja => {
    const f = caja.getAttribute('data-fila');
    const c = caja.querySelector('[data-fecha]');
    if (c) c.textContent = cal[f] || '';
  });
}

/* Guardado automatico: al salir del campo o al elegir una opcion. */
function conectar(caja, serie){

  const fila   = caja.getAttribute('data-fila');
  const insp   = caja.querySelector('[data-inspector]');
  const obs    = caja.querySelector('[data-observacion]');
  const estado = caja.querySelector('[data-estado]');
  const fecha  = caja.querySelector('[data-fecha]');

  let ultimo = insp.value + '||' + obs.value;
  let yendo  = false;

  async function guardar(){

    const ahora = insp.value + '||' + obs.value;
    if (ahora === ultimo || yendo) return;

    yendo = true;
    estado.className = 'estado esp';
    estado.textContent = 'Guardando...';

    try{
      const r = await pedir({
        accion: 'guardar',
        serie: serie,
        fila: fila,
        inspector: insp.value,
        observacion: obs.value
      });

      if (r && r.ok){
        ultimo = ahora;
        /* La fila 1 marca el arranque: las 12 fechas se recalculan solas. */
        if (r.calendario) pintarFechas(r.calendario);
        else if (r.fecha) fecha.textContent = r.fecha;
        estado.className = 'estado ok';
        estado.textContent = 'Guardado';
        setTimeout(() => { estado.textContent = ''; }, 2500);
      } else {
        estado.className = 'estado err';
        estado.textContent = (r && r.error) ? r.error : 'No se pudo guardar';
      }
    }catch(err){
      estado.className = 'estado err';
      estado.textContent = 'Sin conexión';
    }

    yendo = false;
  }

  insp.addEventListener('blur',   guardar);
  obs .addEventListener('change', guardar);
}

function fallo(t){
  document.getElementById('app').innerHTML = '<div class="fallo">'+esc(t)+'</div>';
}

(async function(){
  const serie = serieDelQR();

  if (!serie){
    fallo('Esta tarjeta se abre desde la ficha del extintor.');
    return;
  }

  try{
    const d = await pedir({ accion: 'inspecciones', serie: serie });
    if (!d || !d.ok){
      fallo(d && d.error ? d.error : 'No se encontró el extintor ' + serie + '.');
      return;
    }
    pintar(d, serie);
  }catch(err){
    fallo('No se pudo conectar. Revisa la señal e inténtalo de nuevo.');
  }
})();
</script>
