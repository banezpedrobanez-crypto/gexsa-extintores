<h1>Historial de atención</h1>
<div class="sub" id="sub">&nbsp;</div>
<div id="app"><div class="msg">Cargando historial...</div></div>
<div class="pie">GEXSA SOLUTIONS E.I.R.L.</div>

<script>
const P = new URLSearchParams(location.search);
const SERIE   = (P.get('serie') || '').trim();
const CLIENTE = (P.get('cliente') || '').trim();
const NUMERO  = (P.get('n') || '').trim();

function esc(t){ return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* Volver: si vino desde la ficha, regresa; si no, abre la ficha de esa serie */
document.getElementById('volver').href = 'index.html?serie=' + encodeURIComponent(SERIE);
document.getElementById('volver').onclick = function(e){
  if (document.referrer && history.length > 1) { e.preventDefault(); history.back(); }
};

function subtitulo(numero, serie){
  var t = [];
  if (numero) t.push('Extintor N.º ' + numero);
  if (serie)  t.push('Serie ' + serie);
  document.getElementById('sub').textContent = t.join(' · ');
}
subtitulo(NUMERO, SERIE);

function claseEstado(e){
  var k = String(e||'').toUpperCase();
  if (k === 'BAJA') return 'p-baja';
  if (k === 'OBSERVADO') return 'p-obs';
  if (k === 'REALIZADO' || k === 'CONFORME') return 'p-ok';
  return 'p-otro';
}

function pintar(d){
  if (!d || !d.ok) { document.getElementById('app').innerHTML = '<div class="msg">No se pudo cargar el historial.</div>'; return; }
  subtitulo(NUMERO || d.numero, SERIE || d.serie);
  if (!d.items || !d.items.length) {
    document.getElementById('app').innerHTML = '<div class="msg">Este extintor todavía no tiene atenciones registradas.</div>';
    return;
  }
  var h = '<div class="tl">';
  d.items.forEach(function(it){
    var baja = String(it.estado).toUpperCase() === 'BAJA' || /BAJA/i.test(it.atencion);
    h += '<div class="it' + (baja ? ' baja' : '') + '"><div class="fila"><div>'
       +   '<div class="f">' + esc(it.fecha) + '</div>'
       +   '<div class="a">' + esc(it.atencion) + '</div>'
       +   (it.detalle ? '<div class="d">' + esc(it.detalle) + '</div>' : '')
       + '</div>'
       + (it.estado ? '<span class="pill ' + claseEstado(it.estado) + '">' + esc(it.estado) + '</span>' : '')
       + '</div></div>';
  });
  document.getElementById('app').innerHTML = h + '</div>';
}

(function(){
  if (!SERIE) { document.getElementById('app').innerHTML = '<div class="msg">Falta la serie del extintor.</div>'; return; }
  if (window.__TEST__) { pintar(window.__TEST__); return; }
  var cb = 'h' + Date.now();
  var listo = false;
  window[cb] = function(d){ listo = true; pintar(d); };
  var s = document.createElement('script');
  s.src = API_URL + '?accion=historial&serie=' + encodeURIComponent(SERIE)
        + '&cliente=' + encodeURIComponent(CLIENTE) + '&callback=' + cb;
  s.onerror = function(){ pintar(null); };
  document.body.appendChild(s);
  setTimeout(function(){ if (!listo) pintar(null); }, 25000);
})();
</script>
</body>
</html>
